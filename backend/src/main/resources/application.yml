server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: business
  # 默认激活本地配置；application-local.yml 提供本机数据库账号（已被 .gitignore 忽略）
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    # 数据库账号密码通过环境变量注入，避免提交到代码仓库
    url: ${DB_URL:jdbc:mysql://localhost:3306/business?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    # 下划线字段自动映射为驼峰属性（product_name → productName）
    map-underscore-to-camel-case: true

logging:
  level:
    com.ecommerce.mapper: info
