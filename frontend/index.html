<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f4ef" />
    <meta name="description" content="可乐商城 - 甄选日常好物，支持商品浏览、购物车、下单与订单管理。" />
    <title>可乐商城 · 甄选日常好物</title>
    <script>
      // 在样式加载前恢复主题与语言，避免首屏闪烁（FOUC）
      (function () {
        try {
          var savedTheme = localStorage.getItem('cola_theme')
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          var theme = savedTheme === 'light' || savedTheme === 'dark'
            ? savedTheme
            : (prefersDark ? 'dark' : 'light')

          document.documentElement.dataset.theme = theme
          if (theme === 'dark') document.documentElement.classList.add('dark')

          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', theme === 'dark' ? '#141210' : '#f6f4ef')

          if (localStorage.getItem('cola_locale') === 'en') {
            document.documentElement.lang = 'en'
          }
        } catch (error) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
